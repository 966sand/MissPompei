<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>英语口语助手 · 地道口语翻译 &amp; 近义词辨析</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <div class="back-btn hidden" id="backBtn">&#8592;</div>
      <div class="appname" id="appname">英语口语助手</div>
      <div class="subtitle">地道口语翻译 · 近义词辨析</div>
      <div class="help-btn" id="helpBtn">?</div>
    </header>
    <div class="help-bubble hidden" id="helpBubble">生活和工作里的话，怎么写才像母语者说的。</div>

    <main class="screen" id="screen">
      <!-- 首页 -->
      <section class="state" id="state-input">
        <div class="search-card">
          <div class="mode-switch" id="modeSwitch">
            <span class="mode-opt active" data-mode="colloquial">口语翻译</span>
            <span class="mode-opt" data-mode="synonym">近义词查询</span>
          </div>
          <textarea id="q" class="q-input" rows="3"
            placeholder="输入中文，即刻翻译地道口语"
            autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
          <div class="input-foot">
            <span class="counter" id="counter">0/200</span>
            <button id="go" class="go-btn">go</button>
          </div>
          <div class="tip" id="tip"></div>
        </div>

        <div class="recent">
          <div class="recent-label">最近查询</div>
          <div class="recent-list" id="recent"></div>
        </div>

        <div class="popular">
          <div class="popular-head">
            <div class="recent-label">热门短语</div>
            <div class="pop-refresh" id="popRefresh">↻ 换一批</div>
          </div>
          <div class="popular-list" id="popList"></div>
        </div>
      </section>

      <!-- 加载中 -->
      <section class="state hidden" id="state-loading">
        <div class="loading-wrap">
          <div class="spinner"></div>
          <div class="loading-text" id="loadingText">翻译中…</div>
        </div>
      </section>

      <!-- 结果 -->
      <section class="state hidden" id="state-result"></section>

      <!-- 阅读 -->
      <section class="state hidden" id="state-reading">
        <div class="sec-head">
          <div class="sec-title">入门英语短文</div>
          <div class="pop-refresh" id="readRefresh">↻ 换一批</div>
        </div>
        <div class="read-list" id="readList"></div>
      </section>

      <!-- 收藏 -->
      <section class="state hidden" id="state-fav">
        <div class="sec-head">
          <div class="sec-title">我的收藏</div>
        </div>
        <div class="lib-review" id="favReview">开始复习（待复习 <span id="reviewBadge">0</span> 个）</div>
        <div class="lib-list" id="favList"></div>
      </section>

      <!-- 复习模式 -->
      <section class="state hidden" id="state-review"></section>
    </main>

    <footer class="bottombar">
      <div class="tabbar">
        <div class="tab active" id="tabHome">首页</div>
        <div class="tab" id="tabRead">阅读</div>
        <div class="tab" id="tabFav">收藏</div>
      </div>
    </footer>
  </div>

  <!-- 分享浮层（与小程序一致：朋友圈 / 微信好友 / 分享链接） -->
  <div class="share-sheet hidden" id="shareSheet">
    <div class="share-mask-bg" id="shareMaskBg"></div>
    <div class="share-panel" id="sharePanel">
      <div class="sp-head">
        <span class="sp-title">分享</span>
        <span class="sp-close" id="shareClose">✕</span>
      </div>
      <div class="sp-preview">
        <img id="shareImg" class="sp-img" alt="分享卡片" />
      </div>
      <div class="sp-options">
        <div class="sp-opt" data-share="timeline">
          <div class="sp-ico ico-moments">📣</div>
          <span class="sp-label">分享到朋友圈</span>
        </div>
        <div class="sp-opt" data-share="session">
          <div class="sp-ico ico-friend">💬</div>
          <span class="sp-label">分享给微信好友</span>
        </div>
        <div class="sp-opt" data-share="link">
          <div class="sp-ico ico-link">🔗</div>
          <span class="sp-label">分享链接</span>
        </div>
      </div>
    </div>
    <canvas id="shareCanvas" width="320" height="440" style="display:none"></canvas>
  </div>

  <script src="/phrase-data.js"></script>
  <script src="/app.js"></script>
</body>
</html>
